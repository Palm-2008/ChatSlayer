name: Build Cordova APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Cordova Globally
        run: npm install -g cordova

      - name: Create Clean Cordova Structure
        run: |
          cordova create cordova_app com.chatslayer.app ChatSlayer
          rm -rf cordova_app/www/*
          cp index.html cordova_app/www/
          cp style.css cordova_app/www/
          cp java.js cordova_app/www/
          cp manifest.json cordova_app/www/ || true
          cp service-worker.js cordova_app/www/ || true
          cp config.xml cordova_app/config.xml || true
          # نسخ مجلد الميديا والأيقونات
          cp -r media cordova_app/www/ || true
          cp -r media cordova_app/ || true

      - name: Build Android APK
        run: |
          cd cordova_app
          cordova platform add android
          # تعديل رقم إصدار Gradle مباشرة داخل ملف الخصائص لتجنب أي خطأ مسار
          sed -i 's/gradle-8.0-bin.zip/gradle-8.4-bin.zip/g' platforms/android/gradle/wrapper/gradle-wrapper.properties
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatSlayer-APK
          path: cordova_app/platforms/android/app/build/outputs/apk/debug/*.apk

