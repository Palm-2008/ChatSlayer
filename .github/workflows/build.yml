      - name: Install Cordova and Build
        env:
          # تقييد استهلاك الذاكرة للسيرفر لمنع التجمّد
          _JAVA_OPTIONS: "-Xmx2048m"
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2048m"
        run: |
          npm install -g cordova
          npx cordova create cordova_app com.chatslayer.app ChatSlayer
          cp config.xml cordova_app/config.xml || true
          
          cd cordova_app
          npx cordova platform add android@13.0.0 --no-telemetry
          
          # تثبيت إضافة GooglePlus
          npx cordova plugin add @salesflare/cordova-plugin-googleplus --save
          
          # نقل ملفات الموقع لمجلد www
          rm -rf www/*
          cp -r ../www/* www/
          
          # إجبار أداة البناء على عدم التجمد وطباعة كل التفاصيل
          npx cordova build android -- --gradleArg=--no-daemon --gradleArg=--stacktrace --gradleArg=--info

