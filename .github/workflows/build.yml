name: Build Cordova APK
on:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses and Install Packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install Cordova and Build
        run: |
          npm install -g cordova
          npx cordova create cordova_app com.chatslayer.app ChatSlayer
          cp config.xml cordova_app/config.xml || true
          
          cd cordova_app
          npx cordova platform add android@13.0.0 --no-telemetry
          
          # تثبيت إضافة GooglePlus المصلحة
          npx cordova plugin add @salesflare/cordova-plugin-googleplus --save
          
          # نقل ملفات الموقع لمجلد www الحقيقي لـ ChatSlayer
          rm -rf www/*
          cp -r ../www/* www/
          cp -r ../media www/ || true
          
          # بناء التطبيق مع طباعة كل التفاصيل والاستمرار ومحاصرة الأخطاء
          cordova build android -- --gradleArg=--continue --gradleArg=--stacktrace --gradleArg=--info
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatSlayer-APK
          path: '**/platforms/android/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error

